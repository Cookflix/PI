<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal de Receitas - Perfil Chef</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.2.0/css/all.min.css"
    integrity="sha512-3i5q9+5X5rqzJCaN6KptCKcD5STo5EasbF4K5GvKwTd/u1xNQUY7XVwL3kEc3V7mA3w3P4S592+NclvJP5cUEQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="../style/styles.css" />
</head>

<body>
  <main class="setup-shell">
    <div class="landing-brand landing-brand--compact">
      <div class="landing-brand__mark">
        <i class="fa-solid fa-hat-chef"></i>
      </div>
      <p>Bem-vindo ao Portal de Receitas</p>
      <h2>Escolha como voce quer usar nossa plataforma</h2>
    </div>

    <div class="setup-card">
      <h3>Configure seu Perfil de Chef</h3>
      <label for="chef-name">Como devemos te chamar?</label>
      <input id="chef-name" type="text" placeholder="Chef..." />
      <div class="setup-actions">
        <a href="index.html" class="button button--ghost">Voltar</a>
        <a href="dashboard.html" class="button button--soft">Continuar</a>
      </div>
    </div>
  </main>
</body>

</html>
